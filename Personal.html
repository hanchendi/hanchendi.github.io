<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal interests of Chendi Han">
  <title>Personal | Chendi Han</title>

  <style>
    :root {
      --page-width: 1080px;
      --text: #222;
      --muted: #666;
      --border: #e5e5e5;
      --link: #1f5f99;
      --background: #ffffff;
      --footer: #f7f7f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.55;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Navigation */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid var(--border);
    }

    .nav-wrap {
      max-width: var(--page-width);
      margin: 0 auto;
      min-height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .site-name {
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .site-name:hover {
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
    }

    .nav-links a {
      color: #333;
    }

    .nav-links a.active {
      color: #000;
      font-weight: 700;
    }

    .menu-button {
      display: none;
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      padding: 4px 0 4px 12px;
    }

    /* Main page */
    main {
      max-width: var(--page-width);
      margin: 0 auto;
      padding: 58px 28px 70px;
      min-height: calc(100vh - 160px);
    }

    .page-title {
      margin: 0 0 28px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 34px;
      line-height: 1.2;
    }

    .personal-intro {
      max-width: 820px;
    }

    .name-line {
      margin: 0 0 26px;
      font-size: 21px;
    }

    .chinese-name {
      font-family: "Songti SC", "STSong", "SimSun", "Microsoft YaHei", serif;
      font-weight: 600;
    }

    .personal-intro p {
      margin: 0 0 16px;
    }

    .personal-intro p:last-child {
      margin-bottom: 0;
    }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--border);
      background: var(--footer);
    }

    .footer-inner {
      max-width: var(--page-width);
      margin: 0 auto;
      padding: 34px 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
    }

    .social-link img {
      max-width: 34px;
      max-height: 34px;
      width: auto;
      height: auto;
      display: block;
    }

    @media (max-width: 760px) {
      body {
        font-size: 17px;
      }

      .nav-wrap {
        min-height: 58px;
        padding: 0 20px;
        position: relative;
      }

      .menu-button {
        display: block;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 58px;
        left: 0;
        right: 0;
        background: #fff;
        border-bottom: 1px solid var(--border);
        padding: 14px 20px 18px;
        flex-direction: column;
        align-items: flex-start;
        gap: 13px;
      }

      .nav-links.open {
        display: flex;
      }

      main {
        padding: 42px 20px 54px;
      }

      .page-title {
        font-size: 30px;
      }

      .name-line {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <nav class="nav-wrap" aria-label="Main navigation">
      <a class="site-name" href="index.html">Chendi Han</a>

      <button class="menu-button" id="menuButton"
              aria-label="Toggle navigation" aria-expanded="false">
        &#9776;
      </button>

      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="Publications.html">Publications</a>
        <a href="Conferences.html">Conferences</a>
        <a href="Projects.html">Projects</a>
        <a class="active" href="Personal.html">Personal</a>
        <a href="Others.html">Others</a>
      </div>
    </nav>
  </header>


  <main>
    <h1 class="page-title">Personal</h1>

    <div class="personal-intro">
      <p class="name-line">
        Chendi Han <span class="chinese-name" lang="zh-CN">(韩晨迪)</span>
      </p>

      <p>
        Outside research, I enjoy traveling, hiking, and indoor rock climbing.
        I also play tennis and piano.
      </p>
      
    </div>
  </main>


  <footer class="site-footer">
    <div class="footer-inner">
      <a class="social-link"
         href="https://scholar.google.com/citations?user=zkBPa6AAAAAJ&hl=en"
         target="_blank" rel="noopener" aria-label="Google Scholar">
        <img src="./picture/main/google-scholar-logo.png" alt="Google Scholar">
      </a>

      <a class="social-link"
         href="https://www.linkedin.com/in/chendi-han-5498b1201/"
         target="_blank" rel="noopener" aria-label="LinkedIn">
        <img src="./picture/main/LinkedIn-logo.png" alt="LinkedIn">
      </a>

      <a class="social-link"
         href="https://github.com/hanchendi"
         target="_blank" rel="noopener" aria-label="GitHub">
        <img src="./picture/main/Github-logo.png" alt="GitHub">
      </a>
    </div>
  </footer>


  <script>
    const menuButton = document.getElementById("menuButton");
    const navLinks = document.getElementById("navLinks");

    menuButton.addEventListener("click", function () {
      const isOpen = navLinks.classList.toggle("open");
      menuButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    navLinks.querySelectorAll("a").forEach(function (link) {
      link.addEventListener("click", function () {
        navLinks.classList.remove("open");
        menuButton.setAttribute("aria-expanded", "false");
      });
    });
  </script>

</body>
</html>
